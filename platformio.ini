; SPECTER, MeshCore Repeater for STM32F103C8T6 + SX1262 (DX-LR30)
;
; Node name: auto-generated from device UID → SPECTER-XXXX (e.g., SPECTER-1811)
; Override: add  -D NODE_NAME_STR="MYNAME"  to build_flags below
;
; Serial: USART1 (PA9=TX, PA10=RX) → CH340 USB adapter @ 115200 8N1
;
; ⚠️  BOOTLOADER FLASH: Use stm32flash -b 57600 (NOT 115200!)
;     This board's bootloader only responds reliably at 57600 baud.
;     See docs/development-notes.md for details.

[env:specter]
platform   = ststm32
board      = genericSTM32F103CB    ; 128KB flash (many clones), 20KB RAM
framework  = arduino

; ── Upload ───────────────────────────────────────────────────────────────────
upload_protocol = serial
upload_port     = /dev/ttyUSB0
upload_speed    = 115200           ; Monitor speed (app runs at 115200)

; ⚠️  DTR/RTS bootloader entry does NOT work on DX-LR30 hardware.
;     Use physical BOOT0+RESET buttons before running stm32flash.
;     The upload_flags below are kept for PlatformIO compatibility but are unused.
upload_flags =
    -i
    dtr,-rts,rts:-dtr,-rts,rts

; ── Monitor ──────────────────────────────────────────────────────────────────
monitor_speed = 115200             ; Firmware runs at 115200 8N1
monitor_port  = /dev/ttyUSB0

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    jgromes/RadioLib @ ^7.6.0      ; SX1262 driver (polling mode, RADIOLIB_NC)
    rweather/Crypto @ ^0.4.0       ; SHA256 + Ed25519 for deterministic keys

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -D HAL_UART_MODULE_ENABLED     ; Enable UART peripherals
    -D ENABLE_HWSERIAL1            ; Map Serial → USART1 (PA9/PA10, NOT USART2!)
    -D RADIOLIB_STATIC_ONLY=1      ; RadioLib polling mode (DIO1 not connected)
    -O2                            ; Optimize for speed (52KB flash, 3KB RAM)

; ── Generic SPECTER repeater ────────────────────────────────────────────────
; Identity/name are generated from the STM32 UID at boot:
;   name: SPECTER-XXXX
;   key : deterministic Ed25519 seed derived from UID
; No NODE_LAT_I / NODE_LON_I flags: ADVERT has no fixed location.
[env:specter_repeater]
platform   = ststm32
board      = genericSTM32F103CB
framework  = arduino
upload_protocol = serial
upload_port     = /dev/ttyUSB1
upload_speed    = 115200
monitor_speed   = 115200
monitor_port    = /dev/ttyUSB1
upload_flags =
    -i
    dtr,-rts,rts:-dtr,-rts,rts
lib_deps =
    jgromes/RadioLib @ ^7.6.0
    rweather/Crypto @ ^0.4.0
build_flags =
    -D HAL_UART_MODULE_ENABLED
    -D ENABLE_HWSERIAL1
    -D RADIOLIB_STATIC_ONLY=1
    -O2